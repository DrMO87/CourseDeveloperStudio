[project]
name = "course-swarm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=0.6.23",
    # §5b overlay: the exported deck is a PDF, so the compositing step needs a PDF
    # library. Already installed in this environment; it was simply never declared.
    "pymupdf>=1.24",
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
    # STEP 6: generate_session.py imports NotebookLMClient directly (run_live) — was never
    # declared, so a fresh install broke at import time on any machine other than the one
    # dev venv that happened to have it. No [browser] extra: the worker never performs an
    # interactive `nlm login`, only reads a pre-authenticated NOTEBOOKLM_AUTH_JSON, so the
    # Playwright/Chromium the extra pulls in is not needed here.
    "notebooklm-py>=0.7.3",
]

[dependency-groups]
# Pillow generates the real PNG fixtures the overlay tests need: python-pptx
# embeds image bytes without decoding them, so a hand-rolled byte string
# passes the PPTX path and fails only under MuPDF — which is the production one.
dev = ["pytest>=8.0", "pillow>=10.0"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["scripts"]
