# academy-brain — TEMPLATE MANIFEST, NOT A COURSE
#
# This vault is the war room: it holds the rules, gates, contracts and
# scaffolding that every real course inherits. It is not itself a course, and
# nothing should be authored into its stage folders.
#
# This file supplies the standalone defaults used by legacy CLI tools and
# tests when no per-job root is provided. Production generation always passes
# a real course vault via `--root`. The values below are deliberately generic
# placeholders. A real course gets its own vault via
#   python -m swarm.new_course <slug> <target-dir> ...
# which writes a real manifest there.
#
# If you find yourself editing this file to describe actual course material,
# stop: you are working in the wrong vault.
name: Academy Template
audience: placeholder — a real course declares its own age band here
levels: [1, 2]
sessions_per_level: 8
providers: [claude, codex, opencode, hermes]
artifact_schedule:
  s1: true
  s2: true
  s3: true
  s4: true
  s5: true
  s6: true
  s7: true
  s8: false
stages:
  digest: 10-digest
  digest_assets: _assets
  provenance: 20-provenance
  receipts: 90-receipts
asset_discovery:
  asset_ref_pattern: (asset-[A-Za-z0-9_-]+\.(?:png|jpg|jpeg|gif))
  asset_source_files:
    - slides-source.md
  expect_references: true
